info:
  name: 03 - Duplicado en mayúsculas (409 Conflict)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/dev/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "NUEVO.APRENDIZ@MISENA.EDU.CO"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Crear Duplicado en Mayúsculas (409 Conflict)", function () {
            expect(res.status).to.equal(409);
            expect(res.body.code).to.equal("EMAIL_ALREADY_EXISTS");
          });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  docs {
    Intenta crear un usuario con el mismo correo del caso 02 pero en mayúsculas para validar unicidad y respuesta 409.
  }

info:
  name: 07 - Inyección SQL en email (404 Not Found)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/dev/users/by-email?email='OR'1'='1'--@x.co"
  params:
    - name: email
      value: "'OR'1'='1'--@x.co"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Inyección SQL en email (404 Not Found)", function () {
            expect(res.status).to.equal(404);
            expect(res.body.code).to.equal("USER_NOT_FOUND");
          });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  docs {
    Verifica que una cadena con sintaxis SQL en el parámetro email se trate de forma segura mediante consulta parametrizada y no exista como registro (404).
  }

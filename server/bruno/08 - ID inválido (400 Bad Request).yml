info:
  name: 08 - ID inválido (400 Bad Request)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/dev/users/no-jesus-tumtum-sajus-uuid"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("ID inválido (400 Bad Request)", function () {
            expect(res.status).to.equal(400);
            expect(res.body.code).to.equal("INVALID_ID");
          });

settings:

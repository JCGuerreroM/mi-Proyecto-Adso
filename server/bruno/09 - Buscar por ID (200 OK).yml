info:
  name: 09 - Buscar por ID (200 OK)
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/dev/users/b0000000-0000-0000-0000-000000000002"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Buscar por ID (200 OK)", function () {
          expect(res.status).to.equal(200);
          expect(res.body.success).to.equal(true);
          expect(res.body.data.id).to.be.a("string").and.match(
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
          );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  docs {
    Consulta un usuario existente por su UUID en PostgreSQL.
  }
